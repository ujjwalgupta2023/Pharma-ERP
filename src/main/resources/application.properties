spring.application.name=pharma-erp
server.port=8081

# H2 file-based database (persists between restarts).
# Stored under the user's home folder (~/.pharma-erp) so data survives app
# re-installs/updates and does not depend on where the app is installed.
# Override the location with: -Dpharma.data.dir=/some/path
pharma.data.dir=${user.home}/.pharma-erp
spring.datasource.url=jdbc:h2:file:${pharma.data.dir}/pharma-erp;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.indent-output=true
